name: Update Snake Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *'   # every day at 00:00 UTC
  workflow_dispatch:

jobs:
  build-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Generate snake SVG
        run: |
          curl -sL "https://github.com/ashutosh1919/github-contribution-grid-snake/raw/master/gen_grid_snake.py" -o gen_grid_snake.py
          python3 gen_grid_snake.py --username sdn9300 --config snake.yml --output snake.svg

      - name: Commit & push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg
          git diff --quiet && echo "No changes" && exit 0
          git commit -m "Update snake contribution graph"
          git push origin main
